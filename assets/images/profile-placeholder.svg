<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Profile placeholder">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1a10"/>
      <stop offset="100%" stop-color="#04120a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#39ff6a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39ff6a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1f7a3d" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="480" fill="url(#bgGrad)"/>
  <rect width="480" height="480" fill="url(#grid)"/>
  <rect width="480" height="480" fill="url(#glow)"/>

  <!-- corner brackets, terminal-frame motif -->
  <g stroke="#39ff6a" stroke-width="3" fill="none" opacity="0.9">
    <path d="M20 60 L20 20 L60 20"/>
    <path d="M420 20 L460 20 L460 60"/>
    <path d="M460 420 L460 460 L420 460"/>
    <path d="M60 460 L20 460 L20 420"/>
  </g>

  <!-- abstract user silhouette built from angular / circuit-like shapes -->
  <g transform="translate(240,260)">
    <circle cx="0" cy="-70" r="70" fill="none" stroke="#39ff6a" stroke-width="4" opacity="0.9"/>
    <path d="M -120 140 C -120 30 -66 -10 0 -10 C 66 -10 120 30 120 140 Z" fill="none" stroke="#39ff6a" stroke-width="4" opacity="0.9"/>
    <circle cx="0" cy="-70" r="4" fill="#39ff6a"/>
  </g>

  <!-- scanline -->
  <rect x="0" y="180" width="480" height="2" fill="#39ff6a" opacity="0.5"/>

  <text x="240" y="440" font-family="'JetBrains Mono', monospace" font-size="16" fill="#7fffa1" text-anchor="middle" opacity="0.85">[ photo.jpg not found ]</text>
</svg>
